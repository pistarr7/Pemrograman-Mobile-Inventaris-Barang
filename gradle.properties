# gradle.properties
# Konfigurasi Gradle untuk project Android

# Menggunakan AndroidX (library modern pengganti Support Library)
android.useAndroidX=true

# Alokasi memori JVM untuk Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Mengaktifkan caching untuk build lebih cepat
org.gradle.configuration-cache=true

# Non-transitive R classes (best practice untuk performa build)
android.nonTransitiveRClass=true
